# Saída: pasta release/ (ignorada no git na raiz do monorepo)
# Versão fixa: em workspaces o electron costuma ficar na raiz e o builder não resolve ^ no package.json.
electronVersion: 33.4.11

appId: com.rihubai.pdfSources
productName: PDF Sources
copyright: Copyright © 2026

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

win:
  target:
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false

linux:
  target:
    - AppImage
  category: Office

mac:
  target:
    - dmg
  category: public.app-category.productivity
