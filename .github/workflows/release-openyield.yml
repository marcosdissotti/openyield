name: Release OpenYield

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-openyield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/openyield/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows portable (.exe)
        run: npm run dist:electron:win -w openyield
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: OpenYield v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Build automático do branch `main` (commit ${{ github.sha }}).

            **Windows:** descarregue o `.exe` portable abaixo.
          generate_release_notes: true
          files: |
            apps/openyield/release/*.exe
          fail_on_unmatched_files: true
